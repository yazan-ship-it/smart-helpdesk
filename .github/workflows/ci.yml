name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk_test
      DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk_test
      DIRECT_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk_test
      # Only for this CI run
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Migrations match the schema
        env:
          # Scratch database for the check. Set only here: Prisma refuses `migrate reset`
          # (the tests' setup) when the shadow database is the main one. The tests are
          # done by now, so reusing their database is fine.
          SHADOW_DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk_test
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Build
        run: npm run build
